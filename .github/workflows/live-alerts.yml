name: Live alerts

# GitHub non garantisce cron sotto i 5 minuti: loop interno a 30s.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: live-alerts
  cancel-in-progress: false

jobs:
  ping-live-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Tick PitchBrain Live Alerts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://saas-player.vercel.app
        run: |
          CRON_SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '\r\n')"
          if [ -z "$CRON_SECRET" ]; then
            echo "Manca il secret GitHub CRON_SECRET."
            exit 1
          fi
          for i in 1 2 3 4 5 6 7 8 9; do
            echo "GET $APP_URL/api/internal/cron/live-alerts tick=$i"
            HTTP_CODE=$(curl -sS --max-time 50 -o /tmp/live-alerts-body.json -w "%{http_code}" \
              -X GET "$APP_URL/api/internal/cron/live-alerts" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Accept: application/json") || {
              echo "curl fallito al tick $i"
              exit 1
            }
            echo "HTTP $HTTP_CODE"
            cat /tmp/live-alerts-body.json
            echo
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "Endpoint live alerts non OK."
              exit 1
            fi
            if grep -q '"monitored":0' /tmp/live-alerts-body.json; then
              echo "Nessuna partita monitorata, esco."
              break
            fi
            if [ "$i" -lt 9 ]; then
              sleep 30
            fi
          done
