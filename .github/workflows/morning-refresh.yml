name: Morning data refresh

# Piano Vercel Hobby: un solo cron al giorno. Questo workflow chiama
# lo stesso endpoint ogni 20 minuti per i Top 5 (dalle 08:00 ora di Roma).
# 06:00 UTC = 08:00 CEST; in inverno i ping prima delle 08:00 Roma vengono ignorati dall'app.
on:
  schedule:
    - cron: "0,20,40 6-18 * * *"
  workflow_dispatch:

jobs:
  ping-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger PitchBrain morning refresh
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://saas-player.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Manca il secret GitHub CRON_SECRET (stesso valore di Vercel → Environment Variables)."
            echo "Repo → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "GET $APP_URL/api/internal/cron/daily-data-refresh"
          HTTP_CODE=$(curl -sS --max-time 240 -o /tmp/morning-body.json -w "%{http_code}" \
            -X GET "$APP_URL/api/internal/cron/daily-data-refresh" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json") || {
            echo "curl fallito (timeout o rete)."
            exit 1
          }
          echo "HTTP $HTTP_CODE"
          cat /tmp/morning-body.json
          echo
          if [ "$HTTP_CODE" = "401" ]; then
            echo "Unauthorized: CRON_SECRET su GitHub non coincide con quello su Vercel."
            exit 1
          fi
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Endpoint morning refresh non OK."
            exit 1
          fi
