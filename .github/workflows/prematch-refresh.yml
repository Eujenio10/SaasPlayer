name: Prematch refresh

# Piano Vercel Hobby: un solo cron al giorno, già usato dal giro mattutino.
# Qui il ping arriva ogni 5 minuti: l'endpoint aggiorna solo se una partita in
# menu inizia tra 55 e 5 minuti. Fuori finestra esce subito. GitHub può ritardare
# gli schedule: per questo la finestra lato app è larga 50 minuti.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: prematch-refresh
  cancel-in-progress: false

jobs:
  ping-prematch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger PitchBrain prematch refresh
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://saas-player.vercel.app
        run: |
          CRON_SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '\r\n')"
          if [ -z "$CRON_SECRET" ]; then
            echo "Manca il secret GitHub CRON_SECRET (stesso valore di Vercel → Environment Variables)."
            echo "Repo → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "GET $APP_URL/api/internal/cron/prematch-refresh"
          set +e
          HTTP_CODE=$(curl -sS --max-time 240 -o /tmp/prematch-body.json -w "%{http_code}" \
            -X GET "$APP_URL/api/internal/cron/prematch-refresh" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json")
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -eq 28 ]; then
            echo "Timeout curl: il rinfresco pre-partita sta ancora girando su Vercel (fino a 300s)."
            echo "Non è un problema di CRON_SECRET. Il prossimo ping tra 5 minuti ritenta se serve."
            exit 0
          fi
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "curl fallito (rete). exit=$CURL_EXIT"
            exit 1
          fi
          echo "HTTP $HTTP_CODE"
          cat /tmp/prematch-body.json
          echo
          if [ "$HTTP_CODE" = "401" ]; then
            echo "Unauthorized: CRON_SECRET su GitHub non coincide con quello su Vercel."
            exit 1
          fi
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Endpoint prematch non OK."
            exit 1
          fi
